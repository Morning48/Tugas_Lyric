<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170907">
  <title>Heavy Rotation — JKT48</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fffaf8;
      --muted: rgba(255, 243, 239, .58);
      --glass: rgba(17, 10, 10, .78);
      --line: rgba(255, 255, 255, .12);
      --accent: #fffaf8;
      --card-radius: 22px;
      --card-width: 1160px;
      --card-height: min(760px, calc(100dvh - 72px));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", Roboto, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(255, 159, 67, .9) 0, transparent 38%),
        radial-gradient(ellipse at 88% 18%, rgba(173, 20, 23, .76) 0, transparent 42%),
        radial-gradient(ellipse at 72% 100%, rgba(92, 15, 25, .86) 0, transparent 48%),
        linear-gradient(135deg, #bc461c 0%, #54120f 47%, #17090a 100%);
      isolation: isolate;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      inset: -18%;
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(ellipse at 23% 30%, rgba(255, 188, 82, .46), transparent 32%),
        radial-gradient(ellipse at 78% 45%, rgba(190, 12, 32, .48), transparent 34%);
      filter: blur(76px);
      animation: atmosphere 28s ease-in-out infinite alternate;
    }

    body::after {
      opacity: .075;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.48'/%3E%3C/svg%3E");
    }

    @keyframes atmosphere {
      from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
      to { transform: translate3d(1.5%, 1%, 0) scale(1.07); }
    }

    .player-card {
      width: min(var(--card-width), calc(100vw - 64px));
      height: var(--card-height);
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, .78fr) minmax(0, 1.42fr);
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: var(--card-radius);
      background: linear-gradient(125deg, rgba(8, 7, 7, .88), rgba(24, 12, 14, .76));
      box-shadow: 0 32px 100px rgba(9, 3, 3, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
      -webkit-backdrop-filter: blur(28px) saturate(125%);
      backdrop-filter: blur(28px) saturate(125%);
      animation: card-arrive 700ms cubic-bezier(.2, .75, .25, 1) both;
    }

    @keyframes card-arrive {
      from { opacity: 0; transform: translateY(12px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .track-panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1vh, 9px);
      padding: 24px clamp(20px, 3vw, 44px);
      border-right: 1px solid rgba(255, 255, 255, .075);
      text-align: center;
    }

    .album-cover {
      display: block;
      width: min(280px, 34vh);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 5px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, .55);
    }

    .track-title {
      margin: 0;
      font-size: clamp(16px, 2.7vh, 20px);
      line-height: 1.2;
      font-weight: 720;
    }

    .track-artist {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .player-controls {
      width: min(100%, 330px);
      margin-top: clamp(6px, 1.5vh, 14px);
      display: grid;
      justify-items: center;
      gap: clamp(6px, 1.5vh, 12px);
    }

    .play-button {
      width: clamp(42px, 8vh, 58px);
      height: clamp(42px, 8vh, 58px);
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .52);
      border-radius: 50%;
      color: #231210;
      background: linear-gradient(145deg, #fff, rgba(255, 242, 237, .88));
      box-shadow: 0 8px 28px rgba(0, 0, 0, .3), inset 0 1px 0 #fff;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .play-button:hover { transform: scale(1.055); box-shadow: 0 11px 32px rgba(0, 0, 0, .4); }
    .play-button:active { transform: scale(.96); }
    .play-button:focus-visible, .lyric-line:focus-visible, .seek-bar:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .play-button svg { width: 23px; height: 23px; fill: currentColor; }
    .play-button .pause-icon { display: none; }
    .play-button[aria-pressed="true"] .play-icon { display: none; }
    .play-button[aria-pressed="true"] .pause-icon { display: block; }

    .timeline {
      width: 100%;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .time-label:last-child { text-align: right; }

    .seek-bar {
      --progress: 0%;
      width: 100%;
      height: 24px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }

    .seek-bar::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(to right, var(--accent) var(--progress), rgba(255, 255, 255, .23) var(--progress));
    }

    .seek-bar::-moz-range-track { height: 3px; border-radius: 99px; background: rgba(255, 255, 255, .23); }
    .seek-bar::-moz-range-progress { height: 3px; border-radius: 99px; background: var(--accent); }

    .seek-bar::-webkit-slider-thumb {
      width: 11px;
      height: 11px;
      margin-top: -4px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 8px rgba(0, 0, 0, .5);
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .seek-bar::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 8px rgba(0, 0, 0, .5);
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .timeline:hover .seek-bar::-webkit-slider-thumb, .seek-bar:active::-webkit-slider-thumb,
    .seek-bar:focus-visible::-webkit-slider-thumb, .timeline:hover .seek-bar::-moz-range-thumb,
    .seek-bar:active::-moz-range-thumb, .seek-bar:focus-visible::-moz-range-thumb { opacity: 1; }

    .play-status {
      min-height: 16px;
      margin: -12px 0 0;
      color: rgba(255, 243, 239, .48);
      font-size: 11px;
      letter-spacing: .01em;
    }

    .lyrics-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 38px clamp(28px, 5vw, 70px);
      overflow: hidden;
    }

    .lyrics-scroll {
      height: 100%;
      overflow-y: auto;
      container-type: size;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 13%, #000 87%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 13%, #000 87%, transparent 100%);
      scroll-behavior: smooth;
    }

    .lyrics-scroll::-webkit-scrollbar { display: none; }

    .lyrics-list {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 14px;
      padding: max(0px, calc(50cqh - 18px)) 0;
    }

    .lyric-line {
      width: 100%;
      flex: 0 0 auto;
      display: block;
      padding: 0;
      border: 0;
      color: rgba(255, 220, 218, .2);
      background: transparent;
      font: inherit;
      font-size: clamp(17px, 1.72vw, 23px);
      font-weight: 650;
      line-height: 1.42;
      text-align: left;
      text-wrap: pretty;
      cursor: pointer;
      opacity: .34;
      filter: blur(1.8px);
      transform: translateZ(0);
      transition: color 380ms ease, opacity 380ms ease, filter 380ms ease, font-size 380ms ease, transform 380ms ease;
    }

    .lyric-line.is-active {
      color: #fff;
      opacity: 1;
      filter: none;
      font-size: clamp(19px, 1.9vw, 25px);
      font-weight: 750;
    }

    .lyric-line.distance-1 { color: rgba(255, 231, 229, .65); opacity: .72; filter: blur(.35px); }
    .lyric-line.distance-2 { color: rgba(255, 220, 218, .4); opacity: .48; filter: blur(.9px); }
    .lyric-line.distance-3 { color: rgba(255, 220, 218, .24); opacity: .3; filter: blur(1.5px); }
    .lyric-line:focus-visible { border-radius: 4px; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) and (orientation: portrait) {
      :root { --card-height: calc(100dvh - 24px); --card-radius: 18px; }
      body { place-items: center; }
      .player-card {
        width: calc(100vw - 24px);
        min-height: 0;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
      }
      .track-panel {
        display: grid;
        grid-template-columns: clamp(76px, 24vw, 112px) minmax(0, 1fr);
        grid-template-rows: auto auto 1fr;
        column-gap: 18px;
        align-content: center;
        justify-items: start;
        padding: 18px 22px 14px;
        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, .075);
        text-align: left;
      }
      .album-cover { width: 100%; grid-column: 1; grid-row: 1 / span 2; border-radius: 4px; }
      .track-title { align-self: end; margin: 0 0 4px; font-size: 17px; }
      .track-artist { align-self: start; }
      .player-controls {
        grid-column: 2;
        width: 100%;
        margin-top: 14px;
        grid-template-columns: 40px minmax(0, 1fr);
        grid-template-rows: auto auto;
        align-items: center;
        column-gap: 14px;
        row-gap: 2px;
      }
      .play-button { width: 40px; height: 40px; grid-column: 1; grid-row: 1 / span 2; }
      .play-button svg { width: 17px; height: 17px; }
      .timeline { grid-column: 2; grid-row: 1; grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 7px; font-size: 10px; }
      .play-status { grid-column: 2; grid-row: 2; min-height: 14px; margin: 0; font-size: 10px; }
      .lyrics-panel { padding: 15px 25px 22px; }
      .lyrics-list { gap: 12px; padding: calc(50% - 14px) 0; }
      .lyric-line { font-size: clamp(16px, 4.4vw, 21px); }
      .lyric-line.is-active { font-size: clamp(19px, 5vw, 24px); }
    }

    @media (max-width: 380px) {
      .track-panel { padding-inline: 16px; column-gap: 13px; }
      .lyrics-panel { padding-inline: 19px; }
      .player-controls { column-gap: 10px; }
    }

    @media (max-height: 700px) and (min-width: 641px) {
      .player-card { min-height: 0; }
      .track-panel { gap: clamp(4px, .8vh, 7px); }
      .track-title { font-size: clamp(16px, 2.7vh, 19px); }
      .player-controls {
        margin-top: clamp(6px, 1.3vh, 10px);
        gap: clamp(5px, 1vh, 8px);
      }
      .play-button { width: 44px; height: 44px; }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      :root { --card-height: calc(100dvh - 36px); }
      .player-card { min-height: 0; }
      .track-panel { gap: clamp(3px, .6vh, 5px); }
      .track-title { font-size: clamp(15px, 3.4vh, 18px); }
      .player-controls {
        margin-top: clamp(4px, 1vh, 7px);
        grid-template-columns: 40px minmax(0, 1fr);
        grid-template-rows: auto auto;
        align-items: center;
        column-gap: 12px;
        row-gap: 0;
        gap: 0;
      }
      .play-button { width: 40px; height: 40px; grid-column: 1; grid-row: 1 / span 2; }
      .timeline { grid-column: 2; grid-row: 1; }
      .play-status { grid-column: 2; grid-row: 2; min-height: 14px; margin: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      body::before { animation: none; }
    }
  </style>
</head>
<body>
  <main class="player-card" aria-label="Pemutar lirik Heavy Rotation">
    <section class="track-panel" aria-label="Informasi lagu dan pemutar">
      <img class="album-cover" src="assets/cover.jpg" alt="Sampul album Heavy Rotation oleh JKT48">
      <h1 class="track-title">Heavy Rotation</h1>
      <p class="track-artist">JKT48</p>

      <div class="player-controls">
        <button class="play-button" id="playButton" type="button" aria-label="Putar Heavy Rotation" aria-pressed="false">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.9c0-.78.85-1.26 1.52-.86l11.04 6.6a1.58 1.58 0 0 1 0 2.72l-11.04 6.6a1 1 0 0 1-1.52-.86V4.9Z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h3.2c.55 0 1 .45 1 1v13c0 .55-.45 1-1 1H6.5c-.55 0-1-.45-1-1v-13c0-.55.45-1 1-1Zm7.8 0h3.2c.55 0 1 .45 1 1v13c0 .55-.45 1-1 1h-3.2c-.55 0-1-.45-1-1v-13c0-.55.45-1 1-1Z"/></svg>
        </button>
        <div class="timeline">
          <span class="time-label" id="currentTime">00:00</span>
          <input class="seek-bar" id="seekBar" type="range" min="0" max="0" step="0.01" value="0" aria-label="Posisi lagu">
          <span class="time-label" id="duration">00:00</span>
        </div>
        <p class="play-status" id="playStatus" aria-live="polite">Tekan putar untuk mulai</p>
      </div>
      <audio id="audio" preload="metadata" src="assets/heavy-rotation.mp3"></audio>
    </section>

    <section class="lyrics-panel" aria-label="Lirik tersinkron">
      <div class="lyrics-scroll" id="lyricsScroll" tabindex="0" aria-label="Daftar lirik, pilih baris untuk melompat ke bagian lagu">
        <div class="lyrics-list" id="lyricsList"></div>
      </div>
    </section>
  </main>

  <script>
    // Lirik disematkan langsung agar halaman tetap berjalan melalui file://.
    const LRC_TEXT = `[00:02.60] One, two, three, four!
[00:08.51] I want you! (I want you!)
[00:11.23] I need you! (I need you!)
[00:13.73] I love you! (I love you!)

[00:19.30] Keras berbunyi irama music
[00:24.50] Heavy rotation
[00:38.14] Seperti popcorn yang meletup-letup
[00:43.95] Kata-kata "suka" menari-nari
[00:49.32] Wajahmu, suaramu, selalu kuingat
[00:54.68] Membuatku menjadi tergila-gila
[01:00.06] Oh, senangnya miliki p'rasaan ini
[01:04.45] Ku sangat merasa beruntung
[01:10.26] I want you! (I want you!)

[01:15.53] I love you! (I love you!)

[01:31.40] I want you! (I want you!)

[01:36.76] I love you! (I love you!)
[01:39.37] Di lubuk hatiku
[01:42.82] Rasa sayang yang terus-menerus meluap
[01:47.76] Heavy rotation
[01:56.06] Dalam kehidupan setiap manusia
[02:01.98] B'rapa kali bisa rasakan cinta?
[02:07.48] Jika ada satu cinta tak terlupa
[02:12.74] Ku akan merasa sangat bahagia
[02:17.97] Mungkin seperti perasaan sekuntum
[02:22.58] Bunga saat dia akan mekar
[02:28.88] I feel you! (I feel you!)
[02:31.37] I touch you! (I touch you!)
[02:34.11] I hold you! (I hold you!)
[02:36.86] Di dalam mimpiku
[02:39.88] Angan-anganku menjadi semakin besar
[02:44.80] Oh, it's my imagination
[02:50.40] I feel you! (I feel you!)
[02:52.84] I touch you! (I touch you!)
[02:55.53] I hold you! (I hold you!)
[02:58.31] Perasaan ini
[03:01.63] Ku sangat ingin mengutarakan padamu
[03:06.68] Heavy rotation
[03:20.43] Yang s'lalu kudengarkan favorite song
[03:25.18] Seperti lagu yang kusuka
[03:30.91] Kuulang terus tanpa henti 24 hours a day
[03:36.33] Oh, baby, the only request is you
[03:44.62] I want you! (I want you!)
[03:47.49] I need you! (I need you!)
[03:50.27] I love you! (I love you!)
[03:52.91] Bertemu denganmu
[03:56.21] Semakin dekat jarak di antara kita
[04:00.75] Maximum high tension
[04:06.12] I want you! (I want you!)
[04:09.12] I need you! (I need you!)
[04:11.84] I love you! (I love you!)
[04:14.55] Di lubuk hatiku
[04:17.93] Rasa sayang yang terus-menerus meluap
[04:22.93] Heavy rotation
[04:31.13] Heavy rotation`;

    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const seekBar = document.getElementById("seekBar");
    const currentTimeLabel = document.getElementById("currentTime");
    const durationLabel = document.getElementById("duration");
    const playStatus = document.getElementById("playStatus");
    const lyricsScroll = document.getElementById("lyricsScroll");
    const lyricsList = document.getElementById("lyricsList");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // Parser mengabaikan tag metadata/baris kosong, menerima presisi 1-3 digit,
    // timestamp ganda, dan mengurutkan hasil berdasarkan waktu.
    function parseLrc(source) {
      const entries = [];
      for (const rawLine of source.split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line) continue;
        const stamps = [...line.matchAll(/\[(\d+):(\d{2})(?:\.(\d{1,3}))?\]/g)];
        if (!stamps.length) continue;
        const text = line.replace(/\[(\d+):(\d{2})(?:\.(\d{1,3}))?\]/g, "").trim();
        if (!text) continue;
        for (const stamp of stamps) {
          const fraction = stamp[3] ? Number(`0.${stamp[3]}`) : 0;
          entries.push({ time: Number(stamp[1]) * 60 + Number(stamp[2]) + fraction, text });
        }
      }
      return entries.sort((a, b) => a.time - b.time);
    }

    const lyrics = parseLrc(LRC_TEXT);
    const lyricButtons = lyrics.map((entry, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "lyric-line";
      button.textContent = entry.text;
      button.dataset.index = String(index);
      button.addEventListener("click", () => seekTo(entry.time, true));
      lyricsList.append(button);
      return button;
    });

    let activeIndex = -1;
    let lastAutoScrolledIndex = -1;
    let animationFrame = 0;
    let pendingSeek = null;
    let manualScrollUntil = 0;
    let manualScrollTimer = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
      const whole = Math.floor(seconds);
      return `${String(Math.floor(whole / 60)).padStart(2, "0")}:${String(whole % 60).padStart(2, "0")}`;
    }

    function updateProgress() {
      const current = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      const total = Number.isFinite(audio.duration) ? audio.duration : 0;
      currentTimeLabel.textContent = formatTime(current);
      durationLabel.textContent = formatTime(total);
      seekBar.max = String(total);
      seekBar.value = String(Math.min(current, total || 0));
      seekBar.style.setProperty("--progress", `${total > 0 ? (current / total) * 100 : 0}%`);
    }

    // Pencarian biner membuat seek maju/mundur dan pemutaran tetap tepat.
    function findActiveIndex(time) {
      let low = 0;
      let high = lyrics.length - 1;
      let found = -1;
      while (low <= high) {
        const middle = (low + high) >> 1;
        if (lyrics[middle].time <= time) {
          found = middle;
          low = middle + 1;
        } else {
          high = middle - 1;
        }
      }
      return found;
    }

    // Baris aktif dipusatkan; interaksi manual menahan auto-scroll selama 2,6 detik.
    function centerActiveLine(index) {
      const line = lyricButtons[index];
      if (!line) return;
      const lineTop = line.getBoundingClientRect().top - lyricsScroll.getBoundingClientRect().top + lyricsScroll.scrollTop;
      const top = lineTop - (lyricsScroll.clientHeight - line.offsetHeight) / 2;
      lyricsScroll.scrollTo({ top, behavior: reducedMotion.matches ? "auto" : "smooth" });
      lastAutoScrolledIndex = index;
    }

    function setActiveLine(nextIndex) {
      if (nextIndex !== activeIndex) {
        activeIndex = nextIndex;
        lyricButtons.forEach((line, index) => {
          const distance = activeIndex < 0 ? Infinity : Math.abs(index - activeIndex);
          line.classList.toggle("is-active", index === activeIndex);
          line.classList.toggle("distance-1", distance === 1);
          line.classList.toggle("distance-2", distance === 2);
          line.classList.toggle("distance-3", distance === 3);
          if (index === activeIndex) line.setAttribute("aria-current", "true");
          else line.removeAttribute("aria-current");
        });
      }
      if (activeIndex >= 0 && activeIndex !== lastAutoScrolledIndex && performance.now() >= manualScrollUntil) {
        centerActiveLine(activeIndex);
      }
      if (activeIndex < 0 && nextIndex < 0) lastAutoScrolledIndex = -1;
    }

    function renderFrame() {
      updateProgress();
      setActiveLine(findActiveIndex(audio.currentTime));
      if (!audio.paused && !audio.ended) animationFrame = requestAnimationFrame(renderFrame);
    }

    function startAnimation() {
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(renderFrame);
    }

    // Seek satu fungsi untuk progress bar, pintasan keyboard, dan klik lirik.
    function seekTo(time, shouldPlay = false) {
      const targetTime = Math.max(0, time);
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = Math.min(targetTime, audio.duration);
        pendingSeek = null;
      } else {
        pendingSeek = targetTime;
      }
      updateProgress();
      setActiveLine(findActiveIndex(audio.currentTime));
      if (shouldPlay) {
        audio.play().then(() => { playStatus.textContent = "Sedang diputar"; }).catch(() => {
          playStatus.textContent = "Audio tidak dapat diputar di browser ini";
        });
      }
    }

    function syncPlaybackButton() {
      const playing = !audio.paused && !audio.ended;
      playButton.setAttribute("aria-pressed", String(playing));
      playButton.setAttribute("aria-label", playing ? "Jeda Heavy Rotation" : "Putar Heavy Rotation");
      playStatus.textContent = playing ? "Sedang diputar" : (audio.currentTime > 0 ? "Dijeda" : "Tekan putar untuk mulai");
    }

    playButton.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => { playStatus.textContent = "Audio tidak dapat diputar di browser ini"; });
      } else {
        audio.pause();
      }
    });

    seekBar.addEventListener("input", () => seekTo(Number(seekBar.value)));
    audio.addEventListener("loadedmetadata", () => {
      if (pendingSeek !== null) {
        audio.currentTime = Math.min(pendingSeek, audio.duration);
        pendingSeek = null;
      }
      updateProgress();
      if ("mediaSession" in navigator && "MediaMetadata" in window) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Heavy Rotation",
          artist: "JKT48",
          artwork: [{ src: new URL("assets/cover.jpg", document.baseURI).href, sizes: "300x300", type: "image/jpeg" }]
        });
      }
    });
    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("play", () => { syncPlaybackButton(); startAnimation(); });
    audio.addEventListener("pause", () => { syncPlaybackButton(); cancelAnimationFrame(animationFrame); renderFrame(); });
    audio.addEventListener("ended", () => {
      audio.pause();
      audio.currentTime = 0;
      cancelAnimationFrame(animationFrame);
      lastAutoScrolledIndex = -1;
      setActiveLine(-1);
      lyricsScroll.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
      updateProgress();
      syncPlaybackButton();
    });
    audio.addEventListener("error", () => { playStatus.textContent = "File audio tidak dapat dimuat"; });

    function markManualScroll() {
      manualScrollUntil = performance.now() + 2600;
      clearTimeout(manualScrollTimer);
      manualScrollTimer = window.setTimeout(() => {
        if (activeIndex >= 0) centerActiveLine(activeIndex);
      }, 2650);
    }
    lyricsScroll.addEventListener("wheel", markManualScroll, { passive: true });
    lyricsScroll.addEventListener("touchstart", markManualScroll, { passive: true });
    lyricsScroll.addEventListener("pointerdown", event => {
      if (event.pointerType === "touch") markManualScroll();
    }, { passive: true });

    document.addEventListener("keydown", event => {
      const target = event.target;
      const isEditable = target instanceof HTMLElement && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
      if (isEditable) return;
      if (event.code === "Space" && !(target instanceof HTMLElement && target.closest("button"))) {
        event.preventDefault();
        if (audio.paused) audio.play().catch(() => { playStatus.textContent = "Audio tidak dapat diputar di browser ini"; });
        else audio.pause();
      } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        seekTo(audio.currentTime + (event.key === "ArrowRight" ? 5 : -5));
      }
    });

    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => audio.play().catch(() => {}));
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("seekbackward", details => seekTo(audio.currentTime - (details.seekOffset || 5)));
      navigator.mediaSession.setActionHandler("seekforward", details => seekTo(audio.currentTime + (details.seekOffset || 5)));
    }

    updateProgress();
  </script>
</body>
</html>
